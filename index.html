<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSpace — Team Chat, Shared Notes & Private AI Companion</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        surface: {
                            950: '#0E0F13',
                            900: '#131418',
                            850: '#181A20',
                            800: '#1E2028',
                            750: '#252832',
                            700: '#2C303B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Sleek Minimal Scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Smooth Fade-in Animation for Messages & Cards */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-up {
            animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Subtle AI Shimmer Effect */
        @keyframes pulseSubtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        .ai-pulse {
            animation: pulseSubtle 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-surface-950 text-zinc-100 font-sans h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- ===================================================================== -->
    <!-- TOP GLOBAL NAVIGATION BAR                                             -->
    <!-- ===================================================================== -->
    <header class="h-14 bg-surface-900/95 backdrop-blur-md border-b border-surface-700/80 px-4 flex items-center justify-between shrink-0 z-30">
        <!-- Left: Brand & Mobile Sidebar Toggle -->
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl bg-surface-800 hover:bg-surface-750 text-zinc-300 hover:text-white transition-colors" title="Toggle Navigation">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>

            <div class="flex items-center space-x-2.5 cursor-pointer" onclick="setLayoutMode('studio')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-display font-bold text-base tracking-tight text-white">SyncSpace</span>
                        <span class="hidden sm:inline-block text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">Workspace</span>
                    </div>
                    <p class="text-[11px] text-zinc-400 hidden sm:block">Team Chat • Shared Notes • Private AI</p>
                </div>
            </div>
        </div>

        <!-- Center: Easy Layout Mode Switcher -->
        <div class="flex items-center bg-surface-950 p-1 rounded-xl border border-surface-700/80 shadow-inner">
            <button id="layoutBtn-studio" onclick="setLayoutMode('studio')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 bg-indigo-600 text-white shadow-sm">
                <span>✨</span>
                <span>All-in-One Studio</span>
            </button>
            <button id="layoutBtn-chat" onclick="setLayoutMode('chat')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 text-zinc-400 hover:text-white">
                <span>💬</span>
                <span class="hidden md:inline">Team Chat</span>
            </button>
            <button id="layoutBtn-notes" onclick="setLayoutMode('notes')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 text-zinc-400 hover:text-white">
                <span>📝</span>
                <span class="hidden md:inline">Shared Notes</span>
            </button>
            <button id="layoutBtn-ai" onclick="setLayoutMode('ai')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5 text-zinc-400 hover:text-white">
                <span>🤖</span>
                <span class="hidden md:inline">Private AI</span>
            </button>
        </div>

        <!-- Right: Online Team Members & User Profile -->
        <div class="flex items-center space-x-3">
            <div class="hidden xl:flex items-center space-x-2 bg-surface-850 border border-surface-700/70 px-3 py-1.5 rounded-xl">
                <div class="flex -space-x-2">
                    <div class="w-6 h-6 rounded-full bg-emerald-600 ring-2 ring-surface-900 flex items-center justify-center text-[10px] font-bold text-white" title="You (Online)">YO</div>
                    <div class="w-6 h-6 rounded-full bg-sky-500 ring-2 ring-surface-900 flex items-center justify-center text-[10px] font-bold text-white" title="Sarah Chen (Online)">SC</div>
                    <div class="w-6 h-6 rounded-full bg-amber-500 ring-2 ring-surface-900 flex items-center justify-center text-[10px] font-bold text-white" title="Alex Rivera (Online)">AR</div>
                    <div class="w-6 h-6 rounded-full bg-fuchsia-600 ring-2 ring-surface-900 flex items-center justify-center text-[10px] font-bold text-white" title="Maya Lin (In Notes)">ML</div>
                </div>
                <span class="text-xs text-zinc-300 font-medium">4 Online</span>
            </div>

            <button onclick="openHelpModal()" class="p-2 rounded-xl bg-surface-800 hover:bg-surface-750 text-zinc-300 hover:text-white border border-surface-700/70 transition-colors" title="Quick Tour & How It Works">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- ===================================================================== -->
    <!-- MAIN WORKSPACE BODY (SIDEBAR + 3 CORE SECTIONS)                       -->
    <!-- ===================================================================== -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- ================================================================= -->
        <!-- LEFT NAVIGATION SIDEBAR (SPACES, CHANNELS & NOTES)                -->
        <!-- ================================================================= -->
        <aside id="leftSidebar" class="w-64 bg-surface-900 border-r border-surface-700/80 flex flex-col shrink-0 z-20 select-none transition-all">
            
            <!-- Workspace Switcher Dropdown Trigger -->
            <div class="p-3 border-b border-surface-700/60">
                <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5 px-1">Current Space</label>
                <div class="relative">
                    <select id="workspaceSelect" onchange="switchWorkspace(this.value)" class="w-full appearance-none bg-surface-800 hover:bg-surface-750 text-white font-display font-semibold text-sm rounded-xl px-3.5 py-2.5 pr-8 border border-surface-700 focus:outline-none focus:border-indigo-500 cursor-pointer transition-colors">
                        <!-- Populated by JS -->
                    </select>
                    <svg class="w-4 h-4 text-zinc-400 absolute right-3 top-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>
                </div>
            </div>

            <!-- Scrollable Channels & Shared Notes Tree -->
            <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">

                <!-- 1. TEAM CHAT CHANNELS (Discord-style) -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-2">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Team Chat</span>
                        </div>
                        <button onclick="openCreateModal('channel')" class="text-zinc-400 hover:text-white hover:bg-surface-750 p-1 rounded-lg transition-colors" title="Create New Chat Channel">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/></svg>
                        </button>
                    </div>
                    <div id="sidebarChannelsList" class="space-y-1">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- 2. SHARED TEAM NOTES (Notion-style) -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-2">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Shared Notes</span>
                        </div>
                        <button onclick="openCreateModal('note')" class="text-zinc-400 hover:text-white hover:bg-surface-750 p-1 rounded-lg transition-colors" title="Create New Shared Note">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/></svg>
                        </button>
                    </div>
                    <div id="sidebarNotesList" class="space-y-1">
                        <!-- Populated by JS -->
                    </div>
                    <button onclick="openCreateModal('note')" class="mt-2 w-full px-3 py-2 rounded-xl border border-dashed border-surface-700 hover:border-indigo-500/60 hover:bg-indigo-500/5 text-xs text-zinc-400 hover:text-indigo-300 flex items-center justify-center space-x-1.5 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span>New Note Page</span>
                    </button>
                </div>

                <!-- 3. PRIVATE AI COMPANION SHORTCUT CARD -->
                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-indigo-950/70 via-surface-850 to-violet-950/50 border border-indigo-500/30 space-y-2.5 shadow-lg">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-indigo-300 flex
